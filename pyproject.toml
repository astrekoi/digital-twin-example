[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plc-twin"
version = "0.2.0"
description = "PLC digital twin - Raspberry Pi 5 + Taipy + Celery + AI + IPFS/Hedera"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{name = "astrokoit", email = "astrokoit@gmail.com"}]

dependencies = [
    # core
    "pydantic>=2.13,<3",
    "pyyaml>=6,<7",
    "python-dotenv>=1,<2",
    "httpx>=0.27,<1",
    # tasks
    "celery[redis]>=5.4,<6",
    "redis>=5,<7",
    "apscheduler>=3.10,<4",
    # UI
    "taipy>=4.1,<5",
    "plotly>=6,<7",
    # data / AI inference (training-only deps in [dependency-groups].ai)
    "pandas>=2.2,<3",
    "numpy>=2,<3",
    "joblib>=1.5,<2",
    "scikit-learn>=1.5,<2",
    # integrations
    "hiero-sdk-python==0.2.5",
    # hardware deps (apt packages built for python3.13 are not visible to a cpython 3.12 venv)
    "rpi-lgpio",
    "adafruit-circuitpython-bme280",
    "adafruit-circuitpython-bmp280",
    "adafruit-circuitpython-bh1750",
    "adafruit-circuitpython-ina219",
    "luma.oled",
    "troykahat",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
]

[dependency-groups]
ai = [
    "xgboost>=2.1,<4",
    "prophet>=1.1,<2",
    "tensorflow>=2.18,<3",
    "torch>=2.5,<3",
    "lightgbm>=4.5,<5",
    "darts[torch]>=0.44,<0.45",
]
dev = [
    "pytest>=8,<10",
    "respx>=0.21,<1",
    "ruff==0.6.9",
    "pytest-cov>=5,<8",
]

# uv treats this as an application, not a distributable wheel.
# `uv sync` installs dependencies; the project itself is not built/packaged.
[tool.uv]
package = false

# Override transitive constraints that conflict but are functionally compatible.
# - python-dotenv: taipy-gui pins <=1.0.1 (too strict); hiero-sdk-python wants
#   >=1.2.1. Both work fine with 1.2.x in practice (pytest 28/28 green via pip).
override-dependencies = [
    "python-dotenv>=1.2.1,<2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Bootstrap scripts: sys.path.insert(...) before project imports is intentional.
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
